{% extends 'base.html' %}

{% block content %}
<h2 class="text-danger">Supprimer une conférence</h2>

<div class="alert alert-warning">
    Voulez-vous vraiment supprimer <strong>{{ object.name }}</strong> ?
</div>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, supprimer</button>
    <a href="{% url 'conference_liste' %}" class="btn btn-secondary">Annuler</a>
</form>

{% endblock %}
