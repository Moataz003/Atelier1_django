{% extends 'base.html' %}

{% block content %}
<h2 class="mb-4">
    {% if view.object %}Modifier une conférence{% else %}Créer une conférence{% endif %}
</h2>

<form method="post" class="card p-4 shadow-sm">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-primary mt-2">
        Enregistrer
    </button>
</form>

{% endblock %}
